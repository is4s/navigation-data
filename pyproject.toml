[project]
name = "pntos-python-datasets-lcm"
version = "0.1.0"
description = "An LCM log designed for use in pntos-python."
authors = [{ name = "IS4S", email = "pntos@is4s.com" }]
dependencies = []
readme = "README.md"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["pntos_python_datasets_lcm/**"]

[tool.hatch.build.targets.wheel]
include = ["pntos_python_datasets_lcm/**"]

[project.scripts]
play-lcm-dataset = "pntos_python_datasets_lcm.play_lcm_dataset:play_lcm_dataset"
